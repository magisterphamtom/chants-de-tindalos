<div class="tab" data-tab="milieux" data-group="sheet" role="tabpanel">

  <div class="section-title">Points de Milieu</div>
  <p style="font-size:0.8em;color:#5c3010;margin-bottom:10px;">
    Cliquez sur un milieu pour lancer un jet de Charisme avec les dés bonus correspondants.
  </p>

  <div class="milieux-grid">

    <div class="milieu-row rollable" data-milieu="academie">
      <span class="milieu-icone">🎓</span>
      <label>Académie</label>
      <input type="number" name="system.milieux.academie"
             value="{{system.milieux.academie}}" min="0" max="5" />
    </div>

    <div class="milieu-row rollable" data-milieu="commerce">
      <span class="milieu-icone">⚖️</span>
