<div class="tab" data-tab="combat" data-group="sheet" role="tabpanel">

  <!-- ARMES -->
  <div class="section-title">Armes</div>
  <div class="armes-list">

    {{#each system.armes as |arme id|}}
    <div class="arme-row">
      <div class="arme-infos">
        <input type="text" class="arme-nom"
               name="system.armes.{{id}}.nom"
               value="{{arme.nom}}"
               placeholder="Nom de l'arme" />
        <select name="system.armes.{{id}}.type" class="arme-type">
          <option value="corpsacorps"
            {{#if (eq arme.type "corpsacorps")}}selected{{/if}}>
            Corps-à-corps (VIG)
          </option>
          <option value="distance"
            {{#if (eq arme.type "distance")}}selected{{/if}}>
            Distance (AGI)
          </option>
        </select>
        <select name="system.armes.{{id}}.portee" class="arme-portee">
          <option value="CaC"
            {{#if (eq arme.portee "CaC")}}selected{{/if}}>CaC</option>
          <option value="Courte"
            {{#if (eq arme.portee "Courte")}}selected{{/if}}>Courte</option>
          <option value="Longue"
            {{#if (eq arme.portee "Longue")}}selected{{/if}}>Longue</option>
        </select>
      </div>
      <div class="arme-stats">
        <div class="arme-stat">
          <label>Létalité</label>
          <input type="number" name="system.armes.{{id}}.letalite"
                 value="{{arme.letalite}}" min="1" />
        </div>
        <div class="arme-stat">
          <label>Blessure</label>
          <select name="system.armes.{{id}}.blessure">
            <option value="Superficielle"
              {{#if (eq arme.blessure "Superficielle")}}selected{{/if}}>
              Superficielle (-1 Réserve)
            </option>
            <option value="Legere"
              {{#if (eq arme.blessure "Legere")}}selected{{/if}}>
              Légère (-2 Réserve)
            </option>
            <option value="Moderee"
              {{#if (eq arme.blessure "Moderee")}}selected{{/if}}>
              Modérée (-4 Réserve, +1 SD)
            </option>
            <option value="Serieuse"
              {{#if (eq arme.blessure "Serieuse")}}selected{{/if}}>
              Sérieuse (-6 Réserve, +2 SD)
            </option>
          </select>
        </div>
        <button type="button" class="btn-attaquer rollable"
                data-arme="{{id}}">
          ⚔️ Attaquer
        </button>
      </div>
    </div>
    {{/each}}

  </div>

  <!-- MALUS SD -->
  <div class="section-title">Modificateurs</div>
  <div class="variables-grid">
    <div class="variable-box">
      <label>Malus SD (blessures)</label>
      <input type="number" name="system.malusSD"
             value="{{system.malusSD}}" min="0" readonly />
    </div>
    <div class="variable-box">
      <label>SD Total</label>
      <span class="sd-valeur">{{system.seuilDifficulte}}+</span>
    </div>
  </div>

  <!-- ACTIONS COMBAT -->
  <div class="section-title">Actions</div>
  <div class="actions-barre">
    <button type="button" class="btn-jet-maitrise">
      🎲 Jet de Maîtrise (1d20)
    </button>
    <button type="button" class="btn-jet-defensif">
      🛡️ Jet Défensif
    </button>
    <button type="button" class="btn-arret-cardiaque">
      💀 Arrêt Cardiaque
    </button>
  </div>

  <!-- DÉCLENCHEURS -->
  <div class="section-title">Déclencheurs</div>
  <div class="declencheurs-box">
    <input type="text" name="system.declencheurs"
           value="{{system.declencheurs}}"
           placeholder="Ex: Abeilles et guêpes, Rongeurs..." />
  </div>

  <!-- RITUEL DE DÉCOMPRESSION -->
  <div class="section-title">Rituel de Décompression</div>
  <div class="declencheurs-box">
    <input type="text" name="system.rituelDecompression"
           value="{{system.rituelDecompression}}"
           placeholder="Ex: Se regarder dans le miroir..." />
  </div>

</div>
