<div class="arme-sheet-body">
<style>
.arme-sheet-body { display:flex; flex-direction:column; height:100%; background:#f4e8d0; font-family:inherit; }
.arme-header { display:flex; gap:16px; padding:14px 16px; background:#1a1a3a; align-items:center; }
.arme-portrait-wrapper { position:relative; width:80px; height:80px; flex-shrink:0; cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid #6a3a8b; }
.arme-portrait { width:100%; height:100%; object-fit:cover; display:block; }
.arme-portrait-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:1.5em; opacity:0; transition:opacity 0.2s; }
.arme-portrait-wrapper:hover .arme-portrait-overlay { opacity:1; }
.arme-header-infos { flex:1; display:flex; flex-direction:column; gap:8px; }
.arme-nom-input { background:transparent; border:none; border-bottom:1px solid #6a3a8b; color:#c090f0; font-size:1.3em; font-weight:bold; width:100%; padding:2px 0; }
.arme-nom-input:focus { outline:none; }
.arme-badges { display:flex; flex-wrap:wrap; gap:6px; }
.arme-badge { padding:3px 10px; border-radius:12px; font-size:0.82em; font-weight:bold; background:#1a1a3a; color:#c090f0; border:1px solid #6a3a8b; }
.arme-badge.bonus { background:#2a1a3a; color:#f0c0ff; border-color:#9060c0; font-size:1em; }
.arme-content { flex:1; overflow-y:auto; padding:14px 16px; }
.section-title { font-weight:bold; font-size:0.8em; letter-spacing:0.1em; text-transform:uppercase; color:#6a3a8b; border-bottom:1px solid #c090f0; padding-bottom:4px; margin:12px 0 8px 0; }
.arme-stat-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.arme-stat-box { display:flex; flex-direction:column; gap:3px; }
.arme-stat-box label { font-size:0.78em; font-weight:bold; color:#6a3a8b; text-transform:uppercase; }
.arme-stat-box input, .arme-stat-box select { padding:6px 8px; border:1px solid #c090f0; border-radius:4px; background:#f8f0ff; color:#1a1a3a; font-size:0.95em; }
.arme-stat-box input[type="number"] { text-align:center; font-weight:bold; font-size:1.2em; color:#6a3a8b; }
.full-box input, .full-box textarea { width:100%; padding:8px 10px; border:1px solid #c090f0; border-radius:4px; background:#f8f0ff; color:#1a1a3a; box-sizing:border-box; }
.full-box textarea { min-height:70px; resize:vertical; font-size:0.95em; }
</style>

  <header class="arme-header">
    <div class="arme-portrait-wrapper">
      <img class="arme-portrait" src="{{item.img}}" title="Cliquer pour changer" />
      <div class="arme-portrait-overlay">🖼️</div>
    </div>
    <div class="arme-header-infos">
      <input class="arme-nom-input" type="text" name="name" value="{{item.name}}" />
      <div class="arme-badges">
        <span class="arme-badge">✨ {{system.ecole}}</span>
        <span class="arme-badge bonus">+{{system.modificateur}} au jet d'arcanes</span>
      </div>
    </div>
  </header>

  <div class="arme-content">
    <div class="section-title">Statistiques magiques</div>
    <div class="arme-stat-group">
      <div class="arme-stat-box">
        <label>🌙 École d'arcanes</label>
        <select name="system.ecole">
          <option value="vision"        {{#if (eq system.ecole "vision")}}selected{{/if}}>👁 Vision</option>
          <option value="aneantissement"{{#if (eq system.ecole "aneantissement")}}selected{{/if}}>💀 Anéantissement</option>
          <option value="envoutement"   {{#if (eq system.ecole "envoutement")}}selected{{/if}}>💫 Envoûtement</option>
          <option value="vitalisme"     {{#if (eq system.ecole "vitalisme")}}selected{{/if}}>🌿 Vitalisme</option>
          <option value="cosmos"        {{#if (eq system.ecole "cosmos")}}selected{{/if}}>🌌 Cosmos</option>
          <option value="songe"         {{#if (eq system.ecole "songe")}}selected{{/if}}>💤 Songe</option>
        </select>
      </div>
      <div class="arme-stat-box">
        <label>⚡ Modificateur</label>
        <input type="number" name="system.modificateur" value="{{system.modificateur}}" />
      </div>
    </div>

    <div class="section-title">Utilisation</div>
    <div class="arme-stat-group">
      <div class="arme-stat-box full-box" style="grid-column:1/-1;">
        <label>🔮 Déclencheur</label>
        <input type="text" name="system.declencheur" value="{{system.declencheur}}" placeholder="Ex: Prononcer les incantations écrites" />
      </div>
    </div>
    <div class="arme-stat-group">
      <div class="arme-stat-box full-box" style="grid-column:1/-1;">
        <label>✨ Effet</label>
        <input type="text" name="system.effet" value="{{system.effet}}" placeholder="Ex: +2 à tous les jets de Vitalisme" />
      </div>
    </div>
    <div class="arme-stat-group">
      <div class="arme-stat-box">
        <label>💰 Prix</label>
        <input type="text" name="system.prix" value="{{system.prix}}" placeholder="Inestimable..." />
      </div>
    </div>

    <div class="section-title">Description</div>
    <div class="arme-stat-box full-box">
      <textarea name="system.description" placeholder="Histoire et description de l'artefact...">{{system.description}}</textarea>
    </div>
  </div>

</div>
