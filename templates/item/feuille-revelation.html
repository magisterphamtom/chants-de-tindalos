<div class="arme-sheet-body">
<style>
.arme-sheet-body { display:flex; flex-direction:column; height:100%; background:#f4e8d0; font-family:inherit; }
.arme-header { display:flex; gap:16px; padding:14px 16px; background:#3a1a1a; align-items:center; }
.arme-portrait-wrapper { position:relative; width:80px; height:80px; flex-shrink:0; cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid #8b3a3a; }
.arme-portrait { width:100%; height:100%; object-fit:cover; display:block; }
.arme-portrait-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:1.5em; opacity:0; transition:opacity 0.2s; }
.arme-portrait-wrapper:hover .arme-portrait-overlay { opacity:1; }
.arme-header-infos { flex:1; display:flex; flex-direction:column; gap:8px; }
.arme-nom-input { background:transparent; border:none; border-bottom:1px solid #8b3a3a; color:#f0a090; font-size:1.3em; font-weight:bold; width:100%; padding:2px 0; }
.arme-nom-input:focus { outline:none; }
.arme-badges { display:flex; flex-wrap:wrap; gap:6px; }
.arme-badge { padding:3px 10px; border-radius:12px; font-size:0.82em; font-weight:bold; background:#3a1a1a; color:#f0a090; border:1px solid #8b3a3a; }
.arme-content { flex:1; overflow-y:auto; padding:14px 16px; }
.section-title { font-weight:bold; font-size:0.8em; letter-spacing:0.1em; text-transform:uppercase; color:#8b3a3a; border-bottom:1px solid #f0a090; padding-bottom:4px; margin:12px 0 8px 0; }
.rev-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.rev-box { display:flex; flex-direction:column; gap:3px; }
.rev-box label { font-size:0.78em; font-weight:bold; color:#8b3a3a; text-transform:uppercase; }
.rev-box input, .rev-box select { padding:6px 8px; border:1px solid #f0a090; border-radius:4px; background:#fff8f8; color:#3a1a1a; font-size:0.95em; }
.rev-box textarea { padding:8px; border:1px solid #f0a090; border-radius:4px; background:#fff8f8; color:#3a1a1a; resize:vertical; font-size:0.95em; min-height:60px; }
.rev-box.full { grid-column:1/-1; }
.plp-box { background:#fff0f0; border:1px solid #f0a090; border-radius:6px; padding:10px; margin-top:8px; }
.plp-box .plp-titre { font-weight:bold; color:#8b3a3a; font-size:0.9em; margin-bottom:8px; }
</style>

  <header class="arme-header">
    <div class="arme-portrait-wrapper">
      <img class="arme-portrait" src="{{item.img}}" title="Cliquer pour changer" />
      <div class="arme-portrait-overlay">🖼️</div>
    </div>
    <div class="arme-header-infos">
      <input class="arme-nom-input" type="text" name="name" value="{{item.name}}" />
      <div class="arme-badges">
        <span class="arme-badge">{{system.categorie}}</span>
        {{#if system.entite}}<span class="arme-badge">{{system.entite}}</span>{{/if}}
      </div>
    </div>
  </header>

  <div class="arme-content">
    <div class="section-title">Révélation</div>
    <div class="rev-grid">
      <div class="rev-box">
        <label>📂 Catégorie</label>
        <select name="system.categorie">
          <option value="conviction_initiale"   {{#if (eq system.categorie "conviction_initiale")}}selected{{/if}}>Conviction initiale</option>
          <option value="conviction_superieure" {{#if (eq system.categorie "conviction_superieure")}}selected{{/if}}>Conviction supérieure</option>
          <option value="objectif"              {{#if (eq system.categorie "objectif")}}selected{{/if}}>Objectif</option>
          <option value="etrangete"             {{#if (eq system.categorie "etrangete")}}selected{{/if}}>Étrangeté</option>
          <option value="occulte_initiale"      {{#if (eq system.categorie "occulte_initiale")}}selected{{/if}}>Occulte initiale</option>
          <option value="occulte_superieure"    {{#if (eq system.categorie "occulte_superieure")}}selected{{/if}}>Occulte supérieure</option>
        </select>
      </div>
      <div class="rev-box">
        <label>👁 Entité associée</label>
        <input type="text" name="system.entite" value="{{system.entite}}" placeholder="Ex: Cthulhu" />
      </div>
      <div class="rev-box full">
        <label>💬 Contenu de la révélation</label>
        <textarea name="system.contenu" placeholder="Ce que le personnage sait ou croit...">{{system.contenu}}</textarea>
      </div>
    </div>

    <div class="section-title">Effets</div>
    <div class="rev-grid">
      <div class="rev-box full">
        <label>⚡ Effet sur le personnage</label>
        <input type="text" name="system.effet" value="{{system.effet}}" placeholder="Ex: Maîtrise -1, Angoisse +1" />
      </div>
      <div class="rev-box full">
        <label>🌙 Effet sur les Arcanes</label>
        <input type="text" name="system.effetArcane" value="{{system.effetArcane}}" placeholder="Ex: Vision +1" />
      </div>
    </div>

    <div class="section-title">PLP associé</div>
    <div class="plp-box">
      <div class="rev-grid">
        <div class="rev-box">
          <label>Nom du PLP</label>
          <input type="text" name="system.plpNom" value="{{system.plpNom}}" placeholder="Ex: Monologue" />
        </div>
        <div class="rev-box">
          <label>Niveau (1-4)</label>
          <input type="number" name="system.plpNiveau" value="{{system.plpNiveau}}" min="1" max="4" />
        </div>
        <div class="rev-box full">
          <label>Effet du PLP</label>
          <input type="text" name="system.plpEffet" value="{{system.plpEffet}}" placeholder="Ex: Vous devez DIALOGUER avec vous-même" />
        </div>
      </div>
    </div>

    <div class="section-title">Notes du MJ</div>
    <div class="rev-box full">
      <textarea name="system.description" placeholder="Notes sur cette révélation...">{{system.description}}</textarea>
    </div>
  </div>

</div>
