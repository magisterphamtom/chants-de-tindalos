<div class="arme-sheet-body">
<style>
.arme-sheet-body { display:flex; flex-direction:column; height:100%; background:#f4e8d0; font-family:inherit; }
.arme-header { display:flex; gap:16px; padding:14px 16px; background:#3a1a3a; align-items:center; }
.arme-portrait-wrapper { position:relative; width:80px; height:80px; flex-shrink:0; cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid #8b2d8b; }
.arme-portrait { width:100%; height:100%; object-fit:cover; display:block; }
.arme-portrait-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:1.5em; opacity:0; transition:opacity 0.2s; }
.arme-portrait-wrapper:hover .arme-portrait-overlay { opacity:1; }
.arme-header-infos { flex:1; display:flex; flex-direction:column; gap:8px; }
.arme-nom-input { background:transparent; border:none; border-bottom:1px solid #8b2d8b; color:#d090d0; font-size:1.3em; font-weight:bold; width:100%; padding:2px 0; }
.arme-nom-input:focus { outline:none; }
.arme-badges { display:flex; flex-wrap:wrap; gap:6px; }
.arme-badge { padding:3px 10px; border-radius:12px; font-size:0.82em; font-weight:bold; background:#3a1a3a; color:#d090d0; border:1px solid #8b2d8b; }
.arme-badge.danger { background:#5a1a1a; color:#f09090; border-color:#a04040; }
.arme-content { flex:1; overflow-y:auto; padding:14px 16px; }
.section-title { font-weight:bold; font-size:0.8em; letter-spacing:0.1em; text-transform:uppercase; color:#8b2d8b; border-bottom:1px solid #d090d0; padding-bottom:4px; margin:12px 0 8px 0; }
.substance-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
.sub-box { display:flex; flex-direction:column; gap:3px; padding:8px; background:#fff8ff; border:1px solid #d090d0; border-radius:6px; }
.sub-box label { font-size:0.75em; font-weight:bold; color:#8b2d8b; text-transform:uppercase; }
.sub-box input, .sub-box textarea { padding:5px 8px; border:1px solid #d090d0; border-radius:4px; background:#fff8ff; color:#3a1a3a; font-size:0.9em; }
.sub-box input[type="number"] { text-align:center; font-weight:bold; }
.sub-box textarea { min-height:50px; resize:vertical; }
.sub-box.full { grid-column:1/-1; }
.btn-consommer { width:100%; padding:10px; background:#8b2d8b; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:1em; font-weight:bold; margin-top:12px; transition:background 0.15s; }
.btn-consommer:hover { background:#6d1a6d; }
</style>

  <header class="arme-header">
    <div class="arme-portrait-wrapper">
      <img class="arme-portrait" src="{{item.img}}" title="Cliquer pour changer" />
      <div class="arme-portrait-overlay">🖼️</div>
    </div>
    <div class="arme-header-infos">
      <input class="arme-nom-input" type="text" name="name" value="{{item.name}}" />
      <div class="arme-badges">
        <span class="arme-badge">⏱ {{system.duree}}</span>
        <span class="arme-badge danger">☠️ Surdose: {{system.seuilSurdose}} échec(s)</span>
        {{#if system.prix}}<span class="arme-badge">💰 {{system.prix}}</span>{{/if}}
      </div>
    </div>
  </header>

  <div class="arme-content">

    <div class="section-title">Informations</div>
    <div class="substance-grid">
      <div class="sub-box">
        <label>💰 Prix</label>
        <input type="text" name="system.prix" value="{{system.prix}}" placeholder="25c / dose" />
      </div>
      <div class="sub-box">
        <label>⏱ Durée</label>
        <input type="text" name="system.duree" value="{{system.duree}}" />
      </div>
      <div class="sub-box">
        <label>☠️ Seuil surdose</label>
        <input type="number" name="system.seuilSurdose" value="{{system.seuilSurdose}}" min="1" />
      </div>
    </div>

    <div class="section-title">✅ Effet immédiat</div>
    <div class="substance-grid">
      <div class="sub-box">
        <label>Tension</label>
        <input type="number" name="system.effetTension" value="{{system.effetTension}}" />
      </div>
      <div class="sub-box">
        <label>Réserve</label>
        <input type="text" name="system.effetReserve" value="{{system.effetReserve}}" placeholder="Ex: +1d6" />
      </div>
      <div class="sub-box">
        <label>Sommeil</label>
        <input type="number" name="system.effetSommeil" value="{{system.effetSommeil}}" />
      </div>
      <div class="sub-box full">
        <label>Effet spécial</label>
        <input type="text" name="system.effetSpecial" value="{{system.effetSpecial}}" />
      </div>
    </div>

    <div class="section-title">⚠️ Intoxication</div>
    <div class="substance-grid">
      <div class="sub-box">
        <label>Tension</label>
        <input type="number" name="system.intoTension" value="{{system.intoTension}}" />
      </div>
      <div class="sub-box">
        <label>Réserve</label>
        <input type="number" name="system.intoReserve" value="{{system.intoReserve}}" />
      </div>
      <div class="sub-box">
        <label>Maîtrise</label>
        <input type="number" name="system.intoMaitrise" value="{{system.intoMaitrise}}" />
      </div>
      <div class="sub-box">
        <label>SD</label>
        <input type="number" name="system.intoSD" value="{{system.intoSD}}" />
      </div>
      <div class="sub-box full">
        <label>Effet spécial</label>
        <input type="text" name="system.intoSpecial" value="{{system.intoSpecial}}" />
      </div>
    </div>

    <div class="section-title">🌑 Descente</div>
    <div class="substance-grid">
      <div class="sub-box">
        <label>Tension</label>
        <input type="number" name="system.descenteTension" value="{{system.descenteTension}}" />
      </div>
      <div class="sub-box">
        <label>Réserve</label>
        <input type="number" name="system.descenteReserve" value="{{system.descenteReserve}}" />
      </div>
      <div class="sub-box full">
        <label>Effet spécial</label>
        <input type="text" name="system.descenteSpecial" value="{{system.descenteSpecial}}" />
      </div>
    </div>

    <div class="section-title">Description</div>
    <div class="sub-box full" style="margin:0;">
      <textarea name="system.description" placeholder="Description...">{{system.description}}</textarea>
    </div>

    <button type="button" class="btn-consommer">💉 Consommer cette substance</button>

  </div>

</div>
