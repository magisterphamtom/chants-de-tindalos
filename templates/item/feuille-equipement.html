<div class="arme-sheet-body">
<style>
.arme-sheet-body { display:flex; flex-direction:column; height:100%; background:#f4e8d0; font-family:inherit; }
.arme-header { display:flex; gap:16px; padding:14px 16px; background:#2a2a1a; align-items:center; }
.arme-portrait-wrapper { position:relative; width:80px; height:80px; flex-shrink:0; cursor:pointer; border-radius:6px; overflow:hidden; border:2px solid #8b7513; }
.arme-portrait { width:100%; height:100%; object-fit:cover; display:block; }
.arme-portrait-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:1.5em; opacity:0; transition:opacity 0.2s; }
.arme-portrait-wrapper:hover .arme-portrait-overlay { opacity:1; }
.arme-header-infos { flex:1; display:flex; flex-direction:column; gap:8px; }
.arme-nom-input { background:transparent; border:none; border-bottom:1px solid #8b7513; color:#d4c06a; font-size:1.3em; font-weight:bold; width:100%; padding:2px 0; }
.arme-nom-input:focus { outline:none; border-bottom-color:#f0e080; }
.arme-badges { display:flex; flex-wrap:wrap; gap:6px; }
.arme-badge { padding:3px 10px; border-radius:12px; font-size:0.82em; font-weight:bold; background:#2a2a1a; color:#d4c06a; border:1px solid #8b7513; }
.arme-content { flex:1; overflow-y:auto; padding:14px 16px; }
.section-title { font-weight:bold; font-size:0.8em; letter-spacing:0.1em; text-transform:uppercase; color:#8b7513; border-bottom:1px solid #d4c06a; padding-bottom:4px; margin:12px 0 8px 0; }
.arme-stat-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.arme-stat-box { display:flex; flex-direction:column; gap:3px; }
.arme-stat-box label { font-size:0.78em; font-weight:bold; color:#8b7513; text-transform:uppercase; }
.arme-stat-box input, .arme-stat-box select { padding:6px 8px; border:1px solid #d4c06a; border-radius:4px; background:#fffbe8; color:#3a3a1a; font-size:0.95em; }
.arme-description-box textarea { width:100%; min-height:100px; padding:8px 10px; border:1px solid #d4c06a; border-radius:4px; background:#fffbe8; color:#3a3a1a; resize:vertical; font-size:0.95em; box-sizing:border-box; }
</style>

  <header class="arme-header">
    <div class="arme-portrait-wrapper">
      <img class="arme-portrait" src="{{item.img}}" title="Cliquer pour changer" />
      <div class="arme-portrait-overlay">🖼️</div>
    </div>
    <div class="arme-header-infos">
      <input class="arme-nom-input" type="text" name="name" value="{{item.name}}" />
      <div class="arme-badges">
        <span class="arme-badge">🎒 {{system.categorie}}</span>
        {{#if system.prix}}<span class="arme-badge">💰 {{system.prix}}</span>{{/if}}
      </div>
    </div>
  </header>

  <div class="arme-content">
    <div class="section-title">Informations</div>
    <div class="arme-stat-group">
      <div class="arme-stat-box">
        <label>🎒 Catégorie</label>
        <select name="system.categorie">
          <option value="tabac"        {{#if (eq system.categorie "tabac")}}selected{{/if}}>Tabac</option>
          <option value="photographie" {{#if (eq system.categorie "photographie")}}selected{{/if}}>Photographie</option>
          <option value="bureau"       {{#if (eq system.categorie "bureau")}}selected{{/if}}>Bureau</option>
          <option value="outils"       {{#if (eq system.categorie "outils")}}selected{{/if}}>Outils</option>
          <option value="medical"      {{#if (eq system.categorie "medical")}}selected{{/if}}>Médical</option>
          <option value="accessoires"  {{#if (eq system.categorie "accessoires")}}selected{{/if}}>Accessoires</option>
          <option value="services"     {{#if (eq system.categorie "services")}}selected{{/if}}>Services</option>
          <option value="general"      {{#if (eq system.categorie "general")}}selected{{/if}}>Général</option>
        </select>
      </div>
      <div class="arme-stat-box">
        <label>💰 Prix</label>
        <input type="text" name="system.prix" value="{{system.prix}}" placeholder="Ex: 1,5$" />
      </div>
    </div>

    <div class="section-title">Description</div>
    <div class="arme-description-box">
      <textarea name="system.description" placeholder="Description de l'objet...">{{system.description}}</textarea>
    </div>
  </div>

</div>
